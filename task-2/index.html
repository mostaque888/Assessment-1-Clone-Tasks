
<!doctype html>
<html lang="en">

<head>

  <!-- This tells the browser to use normal text characters. -->
  <meta charset="UTF-8" />

  <!-- This helps my webpage fit different screen sizes,
       including mobile phones, tablets and computers. -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0" />

  <!-- I used purple as the main theme colour
       to match my watch.it website design. -->
  <meta name="theme-color" content="#231651" />

  <!-- This gives a short description of my website. -->
  <meta name="description"
        content="watch.it — discover classic and modern films." />

  <!-- This is the title shown in the browser tab. -->
  <title>watch.it | Movies</title>

  <!-- I connected Google Fonts to use different
       font styles on my webpage. -->
  <link rel="preconnect"
        href="https://fonts.googleapis.com" />

  <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin />

  <!-- I used Lato for normal text and Teko for
       headings, the logo and buttons. -->
  <link
    href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Teko:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

</head>

<body>

  <!-- This is where my React application appears.
       React uses the root element to display my website. -->
  <div id="root"></div>

  <!-- This connects my HTML page to main.jsx,
       which starts my React application. -->
  <script type="module" src="/src/main.jsx"></script>

</body>

</html>
